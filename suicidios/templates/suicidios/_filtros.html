<form method="get" class="row g-3 align-items-end mb-4 p-3 border rounded bg-light">
    <div class="col-6 col-md-2">
        <label for="sexo" class="form-label fw-bold">Sexo</label>
        <select id="sexo" name="sexo" class="form-select">
            {% for valor, texto in opciones.sexos %}
                <option value="{{ valor }}" {% if valor == filtros.sexo %}selected{% endif %}>{{ texto }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-6 col-md-2">
        <label for="edad" class="form-label fw-bold">Grupo etario</label>
        <select id="edad" name="edad" class="form-select">
            {% for valor, texto in opciones.edades %}
                <option value="{{ valor }}" {% if valor == filtros.edad %}selected{% endif %}>{{ texto }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-6 col-md-2">
        <label for="desde" class="form-label fw-bold">Año desde</label>
        <select id="desde" name="desde" class="form-select">
            {% for anio in opciones.anios %}
                <option value="{{ anio }}" {% if anio == filtros.desde %}selected{% endif %}>{{ anio }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-6 col-md-2">
        <label for="hasta" class="form-label fw-bold">Año hasta</label>
        <select id="hasta" name="hasta" class="form-select">
            {% for anio in opciones.anios %}
                <option value="{{ anio }}" {% if anio == filtros.hasta %}selected{% endif %}>{{ anio }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-6 col-md-2">
        <label for="top" class="form-label fw-bold">Cantidad de países</label>
        <select id="top" name="top" class="form-select">
            {% for n in opciones.tops %}
                <option value="{{ n }}" {% if n == filtros.top %}selected{% endif %}>{{ n }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-6 col-md-2">
        <button type="submit" class="btn btn-primary w-100">Actualizar</button>
    </div>
</form>
